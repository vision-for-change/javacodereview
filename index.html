<style>
:root{--bg:#f3f7fc;--fg:#0f2238;--card:#fff;--mut:#566a82;--ac:#f26b1d;--ac2:#2b7bd1;--line:#d6e1ef;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#07162a;--fg:#eaf2fb;--card:#0f2742;--mut:#8fa9c6;--line:#1f3d60}}
:root[data-theme=dark]{--bg:#07162a;--fg:#eaf2fb;--card:#0f2742;--mut:#8fa9c6;--line:#1f3d60}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 8% 0,#2b7bd130,transparent 40%),radial-gradient(circle at 95% 25%,#f26b1d30,transparent 40%),radial-gradient(circle at 50% 100%,#ffc23322,transparent 40%),var(--bg);background-repeat:no-repeat;min-height:100vh;color:var(--fg);font:16px/1.55 'IBM Plex Sans',system-ui,sans-serif}
h1,h2,h3{margin:.3em 0;line-height:1.15}button{font:inherit;cursor:pointer}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:6px;align-items:center;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line);flex-wrap:wrap}
nav b{margin-right:auto;font-size:18px}nav b span{color:var(--ac)}
nav button{border:0;background:none;color:var(--fg);padding:8px 14px;border-radius:99px}nav button.on{background:var(--ac);color:#fff}
main{max-width:1000px;margin:auto;padding:20px 16px 60px}.v{display:none}.v.on{display:block}
.bg,.b2{border:0;border-radius:12px;padding:10px 18px;font-weight:700}.bg{background:linear-gradient(135deg,#f58a2d,#e5481b);color:#fff;box-shadow:0 6px 18px #e5481b55;transition:.2s}.bg:hover{transform:translateY(-2px)}.bg:active{transform:scale(.97)}
.b2{background:var(--card);color:var(--fg);border:1px solid var(--line);padding:7px 12px;font-weight:500}
#home{text-align:center;min-height:70vh;display:none;position:relative;overflow:hidden;padding:12vh 8px}#home.on{display:block}
#home h1{font-size:clamp(40px,10vw,86px);background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
#home p{font-size:22px;color:var(--mut)}#home .bg{font-size:22px;padding:16px 40px;margin-top:20px;position:relative}
.fl{position:absolute;font:700 20px 'IBM Plex Mono',monospace;color:var(--ac2);opacity:.25;animation:fl 9s ease-in-out infinite;pointer-events:none}
@keyframes fl{50%{transform:translateY(-26px) rotate(8deg)}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:700px){.g2{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin:12px 0}
.tc{cursor:pointer;margin:0;transition:.2s;position:relative;overflow:hidden}.tc:hover{transform:translateY(-5px) rotate(-.5deg);border-color:var(--ac)}.tc:active{transform:scale(.97)}
.tc .n{font:700 38px 'IBM Plex Mono',monospace;color:var(--ac)}.tc .vz{font:14px 'IBM Plex Mono',monospace;background:#14122b;color:#7fe0c3;padding:4px 10px;border-radius:8px;display:inline-block}
.pg{height:10px;background:var(--line);border-radius:9px;overflow:hidden;margin:8px 0}.pg i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));transition:.4s}
.hd small,.mut,.sv{color:var(--mut)}.sv{font-size:13px;margin-right:8px}.hd small{font-weight:700;letter-spacing:2px;color:var(--ac)}
pre{margin:0}.cd,textarea.code,#out{background:#14122b;color:#e8e6ff;font:14px/1.5 'IBM Plex Mono',monospace;border-radius:12px;padding:14px;overflow-x:auto;white-space:pre}
.cd i{font-style:normal}.k{color:#ff7ab8}.s{color:#9be88a}.c{color:#7a7aa8}.n{color:#ffb86b}
textarea,input[type=number],select,input:not([type]){width:100%;font:inherit;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--card);color:var(--fg)}
textarea.code{width:100%;min-height:170px;border:0;resize:vertical}textarea.sm{min-height:80px}
#out{min-height:70px;margin-top:6px;white-space:pre-wrap;color:#7fe0c3}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0;align-items:center}.row>*{width:auto}
.drop{border:2px dashed var(--ac2);border-radius:14px;padding:30px 10px;text-align:center;cursor:pointer;display:flex;flex-direction:column;gap:4px;font-size:28px;color:var(--ac2)}.drop b{font-size:16px}.drop small{font-size:13px;color:var(--mut)}
.media img,.media video{max-width:100%;border-radius:12px;display:block}
label{font-weight:700;font-size:13px;letter-spacing:1px;text-transform:uppercase;color:var(--mut);display:block;margin:10px 0 4px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}.chip{background:var(--ac2);color:#fff;padding:6px 14px;border-radius:99px;font-family:'IBM Plex Mono',monospace;animation:pop .4s backwards}@keyframes pop{from{transform:scale(0)}}
#md{position:fixed;inset:0;background:#0009;display:none;place-items:center;z-index:20;padding:16px}#md.on{display:grid}
.box{background:var(--card);border-radius:22px;padding:24px;max-width:520px;width:100%;position:relative;overflow:hidden;animation:pop .3s}
.stage{display:flex;gap:16px;align-items:center;flex-wrap:wrap;justify-content:center;position:relative}.jk{flex:1;min-width:200px}.jk p{color:var(--ac);font-weight:700;font-size:18px}
.bot{width:110px;animation:bn 1.2s ease-in-out infinite}@keyframes bn{50%{transform:translateY(-10px) rotate(3deg)}}
.hdb{width:100px;height:74px;background:linear-gradient(#4c9be0,#2b7bd1);border-radius:22px;position:relative;margin:12px auto 0}.hdb:before{content:"";position:absolute;left:47px;top:-14px;width:6px;height:14px;background:#2b7bd1}.hdb:after{content:"";position:absolute;left:41px;top:-24px;width:18px;height:18px;border-radius:50%;background:var(--ac)}
.ey{position:absolute;top:20px;width:18px;height:22px;background:#fff;border-radius:50%;animation:bl 3s infinite}.ey:after{content:"";position:absolute;left:6px;top:8px;width:7px;height:9px;background:#14122b;border-radius:50%}.ey.a{left:20px}.ey.b{right:20px}
@keyframes bl{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.mo{position:absolute;left:32px;bottom:9px;width:36px;height:14px;border-radius:0 0 20px 20px;background:#14122b}
.bd{width:70px;height:46px;background:#ffc233;border-radius:12px;margin:5px auto}
#stats{display:flex;gap:16px;flex-wrap:wrap;font-weight:700;margin-bottom:8px}#stats span{background:var(--card);border:1px solid var(--line);padding:4px 12px;border-radius:99px}
#cp{position:relative;height:340px;border-radius:20px;overflow:hidden;border:6px solid #2b2a4a;transition:transform .8s;background:#2b2a4a}
#cp.tl{transform:rotate(-3deg)}#cp.tr{transform:rotate(3deg)}
#win{position:absolute;inset:0 0 110px;overflow:hidden;background:linear-gradient(#3aa7ff,#bfe8ff)}
#world{position:absolute;inset:-20px;transition:transform .9s}#world.sl{transform:translateX(-60px)}#world.sr{transform:translateX(60px)}
.cl{position:absolute;width:120px;height:36px;background:#fff;border-radius:40px;opacity:.9;animation:cd 7s linear infinite}@keyframes cd{from{transform:translateY(-40px) scale(.5)}to{transform:translateY(280px) scale(1.6)}}
#ob{position:absolute;left:45%;top:30%;font-size:60px;animation:rock 5s linear infinite}
#ob.bird{animation:bird 4s linear infinite}#ob.deb{animation:deb 5s linear infinite}
@keyframes rock{from{transform:scale(.3)}to{transform:scale(2.6)}}@keyframes bird{from{left:-10%;transform:scale(.7)}to{left:100%;transform:scale(1.6)}}@keyframes deb{from{transform:scale(.3) rotate(0)}to{transform:scale(2.4) rotate(360deg)}}
#ob.pL{animation:pl 1.3s forwards}#ob.pR{animation:pr 1.3s forwards}@keyframes pl{to{transform:translateX(-400px) scale(4);opacity:0}}@keyframes pr{to{transform:translateX(400px) scale(4);opacity:0}}
#msg{position:absolute;top:12%;width:100%;text-align:center;font:700 clamp(16px,3.4vw,30px)/1.3 'IBM Plex Sans',sans-serif;color:#fff;text-shadow:0 2px 6px #000a;z-index:3}
#dash{position:absolute;left:0;right:0;bottom:0;height:120px;background:linear-gradient(#3a3860,#1c1b3a);border-top:6px solid #55527f;display:flex;align-items:center;justify-content:space-around}
.ga{width:62px;height:62px;border-radius:50%;background:#14122b;border:4px solid #7a78a8;position:relative}.ga:after{content:"";position:absolute;left:28px;top:8px;width:3px;height:24px;background:#ffb86b;transform-origin:bottom;transform:rotate(30deg)}
#wl{width:34px;height:34px;border-radius:50%;background:#5a1111;border:3px solid #999}#wl.f{animation:fw .5s infinite}@keyframes fw{50%{background:#ff2b2b;box-shadow:0 0 18px #f22}}
.yk{width:90px;height:50px;border:7px solid #888;border-radius:10px 10px 40px 40px;border-top-width:0;position:relative}
.q button{display:block;width:100%;text-align:left;margin:6px 0;background:var(--card);color:var(--fg);border:2px solid var(--line);border-radius:12px;padding:12px;font-family:'IBM Plex Mono',monospace;font-size:14px}.q button:hover:not(:disabled){border-color:var(--ac)}.q .ok{background:#2bb673!important;color:#fff}.q .no{background:#e5484d!important;color:#fff}
#gw{position:relative;overflow:hidden;border:6px solid #1a1a2e;border-radius:8px;background:#1a1a2e}#cv{width:100%;display:block;transition:transform .8s}#cv.tl{transform:rotate(-3deg)}#cv.tr{transform:rotate(3deg)}#stats span{font:700 14px 'IBM Plex Sans',sans-serif}.fl{opacity:.4!important}
.card{box-shadow:0 10px 30px -18px #0d3b7366}.note{border-left:6px solid var(--ac)}.note h3{font-size:20px}
#topic h2{display:flex;align-items:center;gap:10px;margin-top:28px}#topic h2:before{content:"";width:8px;height:26px;border-radius:4px;background:linear-gradient(var(--ac),var(--ac2))}
.hd{background:linear-gradient(135deg,#0d3b73,var(--ac2));color:#fff;border-radius:20px;padding:20px 22px;margin:14px 0}.hd small,.hd .sv{color:#ffffffd0}.hd h1{font-size:clamp(28px,6vw,44px)}
.tc:before{content:"";position:absolute;left:0;top:0;right:0;height:6px;background:linear-gradient(90deg,var(--ac),var(--ac2))}
textarea:focus,input:focus{outline:2px solid var(--ac);outline-offset:1px}#sr{animation:pu 2.4s infinite}@keyframes pu{50%{box-shadow:0 0 0 14px #2b7bd122}}
nav button:hover{background:var(--line)}nav button.on:hover{background:var(--ac)}

/* ===== Design system v2: graphite + paper neutrals, teal action, amber highlight ===== */
:root{--bg:#f4f3ef;--fg:#1a1c20;--card:#fff;--mut:#5c626b;--line:#e0ddd5;--ac:#0e7467;--btn:#0e7467;--btn2:#0a5f54;--ac2:#96580a;--code:#111417;--ease:cubic-bezier(.2,.7,.2,1)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#111315;--fg:#e8e9eb;--card:#181b1e;--mut:#939aa3;--line:#2a2e33;--ac:#4cc2ac;--btn:#14806f;--btn2:#189380;--ac2:#dea04a}}
:root[data-theme=dark]{--bg:#111315;--fg:#e8e9eb;--card:#181b1e;--mut:#939aa3;--line:#2a2e33;--ac:#4cc2ac;--btn:#14806f;--btn2:#189380;--ac2:#dea04a}
:root{--soft:color-mix(in srgb,var(--fg) 5.5%,transparent);--soft2:color-mix(in srgb,var(--fg) 10%,transparent);--tint:color-mix(in srgb,var(--ac) 8%,transparent);--lift:0 1px 2px #0000001a,0 12px 28px -16px #00000066}
body{background:var(--bg);line-height:1.65;-webkit-font-smoothing:antialiased}
h1,h2,h3{letter-spacing:-.015em}
p{margin:.6em 0}
/* navigation */
nav{background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:0;box-shadow:0 8px 24px -22px #0000008c;padding:12px max(20px,calc(50% - 580px));gap:4px}
nav b{font-size:19px;letter-spacing:-.01em}
nav button{position:relative;border-radius:6px;font-size:15px;font-weight:500;padding:8px 14px;background:none;color:var(--mut);transition:color .2s}
nav button:after{content:'';position:absolute;left:14px;right:14px;bottom:1px;height:2px;background:var(--ac);transform:scaleX(0);transform-origin:left;transition:transform .3s var(--ease)}
nav button:hover{background:none;color:var(--fg)}
nav button.on,nav button.on:hover{background:none;color:var(--fg)}
nav button.on:after,nav button:hover:after{transform:scaleX(1)}
main{max-width:1160px;padding:28px 24px 64px}
/* buttons */
.bg{background:var(--btn);color:#fff;border-radius:6px;padding:11px 22px;font-weight:600;box-shadow:none;transition:background .2s,transform .15s}
.bg:hover{background:var(--btn2);transform:none;box-shadow:none}.bg:active{transform:translateY(1px)}
.b2{background:var(--soft);border:0;border-radius:6px;padding:8px 14px;font-size:14px;font-weight:500;color:var(--fg);transition:background .2s}
.b2:hover:not(:disabled){background:var(--soft2)}.b2:disabled{opacity:.4;cursor:default}
button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
[data-h],[data-s],[data-del]{background:none;color:var(--mut);font-size:13px;padding:6px 12px}
[data-h]:hover,[data-s]:hover,[data-del]:hover{background:var(--soft)!important;color:var(--fg)}
/* sections instead of boxes */
.card{background:none;border:0;border-radius:0;box-shadow:none;padding:0;margin:0 0 28px}
#topic{counter-reset:nt}
#topic h2{display:block;margin:44px 0 16px;font-size:13px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--ac)}
#topic h2:before{display:none}
#topic h2+p.mut{margin:-10px 0 28px}
.mut{color:var(--mut)}
/* lesson header */
.hd{background:none;color:var(--fg);border-radius:0;padding:0;margin:26px 0 8px}
.hd small{color:var(--ac);font-size:13px;letter-spacing:.16em}
.hd .sv{color:var(--mut)}
.hd h1{font-size:clamp(30px,4.6vw,44px);font-weight:600;letter-spacing:-.025em;margin:.25em 0 .35em}
/* home */
#home{padding:9vh 8px 6vh}
#home h1{font-size:clamp(36px,6vw,60px);font-weight:600;letter-spacing:-.03em;background:none;-webkit-background-clip:initial;background-clip:initial;color:var(--fg)}
#home p{font-size:clamp(18px,2.6vw,22px)}
#home .bg{font-size:18px;padding:15px 38px}
.about .row{justify-content:center}.view .about input:placeholder-shown{display:inline-block}.card.about{margin:40px auto 0;max-width:600px}
.about label{text-align:center}
/* table of contents as a list */
#toc h1{font-size:clamp(30px,4.6vw,42px);font-weight:600;letter-spacing:-.025em;margin:.2em 0 .3em}
.pg{height:6px;background:var(--soft2);margin:12px 0 36px}
.grid{grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:6px 28px}
.tc{display:grid;grid-template-columns:56px 1fr;grid-template-areas:"n t" "n d" "n v";align-items:center;column-gap:16px;margin:0 -16px;padding:18px 16px;border-radius:10px;transition:background .2s}
.tc:hover{transform:none;background:var(--soft)}.tc:active{transform:scale(.995)}
.tc:before{display:none}
.tc .n{grid-area:n;font-size:24px;font-weight:500;line-height:1;transition:color .2s}
.tc h3{grid-area:t;margin:0;font-size:19px;font-weight:600;transition:color .2s}
.tc .vz{grid-area:v;justify-self:start;margin-top:8px}
.tc p{grid-area:d;margin:2px 0 0}
#toc>.card{margin-top:40px}
/* fields: soft fills instead of outlines */
textarea,input[type=number],select,input:not([type]){background:var(--soft);border:0;border-radius:7px;padding:12px 14px;line-height:1.55;transition:box-shadow .2s}
::placeholder{color:var(--mut);opacity:.7}
textarea:focus,input:focus,select:focus{outline:0;box-shadow:0 0 0 2px color-mix(in srgb,var(--ac) 65%,transparent)}
label{font-size:12px;font-weight:600;letter-spacing:.1em;margin:20px 0 6px}
.cd,textarea.code,#out{border-radius:8px;padding:16px 18px}
.drop{border:0;background:var(--tint);border-radius:9px;padding:38px 10px;transition:background .2s}
.drop:hover{background:color-mix(in srgb,var(--ac) 14%,transparent)}
.media img,.media video{border-radius:8px;box-shadow:var(--lift)}
.ytw{border-radius:8px}
.labcard{background:var(--tint);color:var(--fg);border:0;border-radius:12px;padding:22px 26px;margin:0 0 28px}
.labcard .mut{color:var(--mut)}
/* quiz + game */
#stats span{background:var(--soft);border:0;padding:6px 14px}
#gw{border:0;border-radius:11px;box-shadow:var(--lift)}
#cp{border:0;border-radius:11px;box-shadow:var(--lift)}
.card.q{margin-top:28px}
.q>b{display:block;font-size:19px;line-height:1.4;margin-bottom:12px}
.q button{background:var(--soft);border:0;border-radius:8px;padding:14px 16px;transition:background .2s}
.q button:hover:not(:disabled){background:var(--soft2)}
.xp{border:0;background:var(--soft);border-radius:8px;padding:14px 16px}
.xp.ok{background:color-mix(in srgb,#2bb673 15%,transparent)}.xp.no{background:color-mix(in srgb,#e5484d 15%,transparent)}
.card.end{max-width:720px;margin:5vh auto}
.card.end h1{letter-spacing:-.03em}
/* modal */
#md{background:#061220aa;-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px)}
.box{border-radius:14px;padding:32px;box-shadow:0 30px 80px -24px #000c}
/* Java Lab (dark workspace): tonal layers, no lines */
.lbx{border:0;border-radius:12px}
.lhd{background:#181b1f;border:0}
.lc{background:#14171a;border:0}
.lft{background:#181b1f;border:0}
.lo{background:#0b0c0e;border:0}
#ltab button{border:0;border-radius:6px;padding:6px 14px}
#ltab button.on{background:var(--btn);color:#fff}
.lc input,.lc select{background:#1f2328;border:0;border-radius:6px}
.lc input:focus,.lc select:focus{box-shadow:0 0 0 2px #4cc2ac99}
.lit{border:0;background:#17302c}
#lx{background:#2a2e33;color:#e8e9eb;border-radius:6px;padding:8px 14px}#lx:hover{background:#7a2d30}
@media(max-width:800px){.lc{border:0}.lbx{border-radius:0}}
@media(max-width:700px){
main{padding:20px 16px 48px}
nav{padding:10px 12px;flex-wrap:nowrap;overflow-x:auto}nav b{margin-right:8px;white-space:nowrap}nav button{white-space:nowrap;padding:8px 12px;font-size:14px}
.tc{grid-template-columns:52px 1fr;margin:0 -12px;padding:14px 12px}.grid{grid-template-columns:1fr}
.tc .n{font-size:24px}
#topic h2{margin-top:36px}.note{margin-bottom:32px}

}
/* image + text balance: centre text against tall media */
.media img,.media video{max-height:72vh;object-fit:contain}
/* Input & Output: guided flow + two-column lessons */
.flow{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;align-items:center;gap:8px 20px;margin:32px 0 0;padding:30px 28px;border-radius:13px;background:var(--tint)}
.flow>div{text-align:center}
.flow small{display:block;font-weight:600;font-size:12px;letter-spacing:.16em;color:var(--ac)}

.flow span{display:block;color:var(--mut);font-size:14px}
.flow code{display:inline-block;margin-top:12px;font:13px 'IBM Plex Mono',monospace;background:var(--code);color:#7fd0bd;padding:5px 12px;border-radius:6px}
.flow i{font-style:normal;color:var(--ac2);font-size:28px}



@media(max-width:820px){
.flow{grid-template-columns:1fr;padding:24px 20px}.flow i{transform:rotate(90deg);justify-self:center}
}
/* analogy: label sits directly above its text, centred against the picture */
@media(max-width:820px){.ana{display:block}.ana>.g2{display:grid;grid-template-columns:1fr;gap:12px}}
/* polish: content blocks */
.cd,textarea.code,#out{background:var(--code)}

.view .g2:has(>.media:has(.drop)),.view .g2:has(>div>.media:has(.drop)){grid-template-columns:1fr}
.media img,.media video{box-shadow:none;background:var(--code)}
.media:has(img,video){background:var(--soft);border-radius:9px;padding:14px;display:flow-root}
.media:has(img,video) img,.media:has(img,video) video{margin:0 auto}
.media .row{justify-content:center;margin:10px 0 0}
#exs>.card{margin-bottom:44px}
#exs>.card>.row b{font-size:20px;letter-spacing:-.01em}

/* ===== v2 additions: type, palette overrides of legacy rules, motion ===== */
body,button,input,textarea,select{font-family:'IBM Plex Sans',system-ui,sans-serif}

/* legacy decoration removed */

/* lab workspace in the same graphite family */

const T=[
{t:'Input & Output',v:'println()',d:'Show text on the screen and read what the user types.',lab:`Scanner input = new Scanner(System.in);\nSystem.out.print("Your name: ");\nString name = input.nextLine();\nSystem.out.println("Hello " + name);`,notes:[
['Showing Output','Output is information that your program sends back to the screen.<br><b>System.out.print()</b> prints something on the same line.<br><b>System.out.println()</b> prints something and then moves to a new line.',`System.out.print("Hello ");\nSystem.out.println("world");\nSystem.out.println("New line!");`],
['Getting Input','A Scanner can read what a person types. To get input, create a Scanner and use a method that matches the kind of value you expect.',`Scanner input = new Scanner(System.in);`],]},
{t:'Operators',v:'+ - * / %',d:'Do math, combine text, and change values.',lab:`int x = 10;\nint y = 3;\nSystem.out.println(x + y);\nSystem.out.println(x - y);\nSystem.out.println(x * y);\nSystem.out.println(x / y);\nSystem.out.println(x % y);`,notes:[
['Arithmetic Operators','+ add, - subtract, * multiply, / divide. Dividing two ints throws away the decimal part.',`int a = 7 / 2; // 3`],
['Modulus','% gives the remainder after division. Great for checking even/odd.',`System.out.println(17 % 5); // 2`],
['Order of Operations','Brackets first, then * / %, then + - (left to right).',`System.out.println(2 + 3 * 4); // 14\nSystem.out.println((2 + 3) * 4); // 20`],
['Special Operators','++ adds 1, -- subtracts 1, += and -= change a variable by an amount.',`int n = 5;\nn++;\nn += 10;\nSystem.out.println(n);`],
['Casting','Casting changes a value to another type. (int) cuts off the decimals.',`System.out.println((int) 7.9); // 7`],
['String Concatenation','+ joins text. Java joins left to right!',`System.out.println("Hi" + 5 + 3);\nSystem.out.println(5 + 3 + "Hi");`]]},
{t:'Variables and Data Types',v:'int x = 5;',d:'Named boxes that store values in memory.',lab:`int age = 16;\nString name = "Alex";\nSystem.out.println(name);\nSystem.out.println(age);`,notes:[
['What is a variable?','A variable is a named place in memory that stores a value your program can use and change.'],
['Declaration','Declaring tells Java the type and name.',`int age;`],
['Initialization','Initializing gives the variable its first value. You can do both at once.',`age = 16;\nint score = 0;`],
['Primitive Data Types','<b>int</b> whole numbers, <b>double</b> decimals, <b>boolean</b> true/false, <b>char</b> one character, <b>long</b> big whole numbers. <b>String</b> is text (an object, not a primitive).',`double price = 4.5;\nboolean done = true;\nchar grade = 'A';\nString name = "Alex";`]]},
{t:'Conditional Statements',v:'if { }',d:'Make your program choose what to do.',lab:`int score = 72;\nif (score >= 90) {\n    System.out.println("A");\n} else if (score >= 70) {\n    System.out.println("B");\n} else {\n    System.out.println("Keep practicing");\n}`,notes:[
['If Statements','Runs the code only if the condition is true.',`if (age >= 16) {\n    System.out.println("Can drive");\n}`],
['If / Else','else runs when the condition is false.',`if (x > 0) {\n    System.out.println("Positive");\n} else {\n    System.out.println("Not positive");\n}`],
['Nested If Statements','An if inside another if.',`if (x > 0) {\n    if (x % 2 == 0) {\n        System.out.println("Positive even");\n    }\n}`],
['Switch Statements','Picks a case based on one value. break stops it from falling through.',`switch (day) {\n    case 1:\n        System.out.println("Mon");\n        break;\n    default:\n        System.out.println("Other");\n}`],
['AND, OR, NOT','&& both true, || at least one true, ! flips true/false.',`if (age > 12 && age < 20) { }`],
['Relational Operators','== equal, != not equal, &lt; &gt; &lt;= &gt;= compare sizes. Use = to assign and == to compare.']]},
{t:'Types of Loops',v:'for ( )',d:'Repeat code without rewriting it.',lab:`for (int i = 1; i < 4; i++) {\n    System.out.println(i);\n}`,notes:[
['While Loops','Repeats while its condition is true. Check before each repeat.',`int i = 1;\nwhile (i <= 3) {\n    System.out.println(i);\n    i++;\n}`],
['For Loops','Start, condition, and change all in one line.',`for (int i = 1; i < 4; i++) {\n    System.out.println(i);\n}`],
['Break','break exits the loop immediately.',`for (int i = 1; i <= 10; i++) {\n    if (i == 4) {\n        break;\n    }\n    System.out.println(i);\n}`]]},
{t:'Types of Errors',v:'try { }',d:'Find, understand, and handle mistakes.',lab:`int a = 10;\nint b = 0;\ntry {\n    System.out.println(a / b);\n} catch (Exception e) {\n    System.out.println("An error occurred.");\n}`,notes:[
['Syntax Errors','Breaking Java\'s grammar (missing ; or bracket). The program will not run. Try deleting a semicolon in the lab!'],
['Logical Errors','The program runs but gives the wrong answer, like using + instead of *.'],
['Debugging','Print values with println, trace your code line by line, and test small pieces.'],

const ch=new DataView(new ArrayBuffer(46));ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(12,tm,true);ch.setUint16(14,dt,true);ch.setUint32(16,crc,true);ch.setUint32(20,sz,true);ch.setUint32(24,sz,true);ch.setUint16(28,nm.length,true);ch.setUint32(42,off,true);cd.push(ch.buffer,nm);off+=30+nm.length+sz}
const cs=cd.reduce((a,b)=>a+b.byteLength,0),e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cs,true);e.setUint32(16,off,true);return new Blob([...parts,...cd,e.buffer],{type:'application/zip'})}

else{const w=Math.sin(P.t*14+h.ph)*7;x.strokeStyle='#0b1215';x.lineWidth=4.5;x.lineCap='round';x.lineJoin='round';x.beginPath();x.moveTo(h.x-17,h.y+w);x.lineTo(h.x,h.y);x.lineTo(h.x+17,h.y+w);x.stroke();x.fillStyle='#e0a458';x.beginPath();x.moveTo(h.x-17,h.y-1);x.lineTo(h.x-25,h.y+2);x.lineTo(h.x-17,h.y+5);x.fill()}}

x.font='600 14px IBM Plex Mono,monospace';x.textAlign='center';for(const e of P.fx){x.globalAlpha=1-e.t/.9;x.fillStyle=e.s=='Hit!'?'#ff8a80':'#e0a458';x.fillText(e.s,e.x,e.y-e.t*26)}x.globalAlpha=1;
if(P.st=='ask'||P.st=='check'||P.st=='crash'){x.fillStyle='rgba(10,14,16,.38)';x.fillRect(0,0,GW,GH)}}

(()=>{if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
let pend=[];const SEL='#topic .uc>*,#toc>*:not(.grid),#toc .tc';
const check=()=>{pend=pend.filter(e=>{if(!e.isConnected)return false;const r=e.getBoundingClientRect();if(r.height===0&&r.width===0)return true;if(r.top<innerHeight*.94){e.classList.add('in');return false}return true})};
const tag=r=>{let n=0;r.querySelectorAll(SEL).forEach(e=>{if(!e.classList.contains('rv')){e.classList.add('rv');pend.push(e);n++}});if(n){void document.body.offsetWidth;check()}};
['#topic','#toc'].forEach(q=>{const r=$(q);if(r)new MutationObserver(()=>tag(r)).observe(r,{childList:true,subtree:true})});
addEventListener('scroll',check,{passive:true});addEventListener('resize',check)})();
home();show('home');
</script></body></html>
